name: Update RealtyRates.com Survey Data

on:
  schedule:
    # Every Monday at 06:00 UTC — realtyrates.com publishes quarterly so weekly is plenty
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if data is current"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/subdivision-analysis-realtyrates-1qDrG

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch survey data
        id: fetch
        run: |
          python3 scripts/fetch_realtyrates.py
          echo "fetched=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Generate standalone report
        run: python3 scripts/generate_report.py

      - name: Check for data changes
        id: changes
        run: |
          git diff --quiet _data/realtyrates/ report/ \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/realtyrates/ report/index.html
          git commit -m "data: refresh RealtyRates.com survey data $(date -u '+%Y-%m-%d')"
          git push origin claude/subdivision-analysis-realtyrates-1qDrG

      - name: Log result
        if: always()
        run: |
          echo "Fetch status : ${{ steps.fetch.outcome }}"
          echo "Data changed : ${{ steps.changes.outputs.changed }}"
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then
            echo "::warning::Scraper failed — existing stub/cached data was kept."
          fi
